<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | EnTHREEpreneurs</title><link rel="icon" href="../assets/enthreepreneurs-logo.jpg"><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><main class="login-wrap"><section class="login-card"><a class="back" href="../index.html">← Back to website</a><img class="logo" src="../assets/enthreepreneurs-logo.jpg" alt="EnTHREEpreneurs logo"><h1>Admin Login</h1><p>For the website owner, class president, and vice president only.</p><div class="notice" id="configNotice">Connecting to the secure class portal...</div><form class="form" id="loginForm" style="margin-top:18px"><label>Email<input name="email" type="email" autocomplete="username" required placeholder="admin@email.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><div class="actions"><button class="btn primary" type="submit">Sign In</button></div><div class="notice hidden" id="error"></div></form></section></main><script src="../js/supabase-config.js"></script><script type="module">
import{configured,supabase}from"../js/supabase-app.js";const n=document.getElementById('configNotice'),f=document.getElementById('loginForm'),err=document.getElementById('error');if(!configured){n.textContent='Supabase is not configured yet. Add your Project URL and Publishable key in js/supabase-config.js.';n.style.background='#fff5e9'}else{n.textContent='Secure sign-in is ready.';const {data}=await supabase.auth.getSession();if(data.session)location.href='dashboard.html'}f.onsubmit=async e=>{e.preventDefault();err.classList.remove('show');if(!configured){err.textContent='Supabase is not configured yet.';err.classList.add('show');return}const fd=new FormData(f);const {error}=await supabase.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error){err.textContent='Sign-in failed. Check the email/password and make sure this account has an admin record.';err.classList.add('show');return}location.href='dashboard.html'};
</script></body></html>
