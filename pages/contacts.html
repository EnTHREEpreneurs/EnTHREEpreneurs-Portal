<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts | EnTHREEpreneurs</title><link rel="icon" href="../assets/enthreepreneurs-logo.jpg"><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><div class="brand-mark"><img src="../assets/enthreepreneurs-logo.jpg" alt="Logo"></div><div class="brand-copy"><strong>EnTHREEpreneurs</strong><span>BS Entrepreneurship • Section 1-3</span></div></a><a class="btn secondary" href="../index.html">Home</a></header><main class="page"><a class="back" href="../index.html">← Back to portal</a><p class="eyebrow">CONTACTS</p><h1>Contacts</h1><p class="page-intro">Current class-officer contacts and useful university-office contacts.</p><div class="page-card"><h2>Class Officers</h2><div class="calendar-list" id="officers"><div class="empty">Loading contacts...</div></div></div><div class="page-card"><h2>University Offices</h2><div class="calendar-list" id="offices"><div class="empty">Loading contacts...</div></div></div></main><footer class="site-footer"><div><strong>EnTHREEpreneurs</strong><p>Our class. Our resources. Our space.</p></div><div>© <span id="year"></span></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear()</script><script src="../js/supabase-config.js"></script><script type="module">
import{configured,supabase}from"../js/supabase-app.js";const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!configured){['officers','offices'].forEach(id=>document.getElementById(id).innerHTML='<div class="notice">Supabase is not configured yet. Follow SETUP.md.</div>');return}const {data,error}=await supabase.from('contacts').select('*').order('name',{ascending:true});if(error){return}const rows=data||[];const draw=cat=>rows.filter(x=>x.category===cat).map(x=>`<article class="calendar-item"><div class="calendar-date">${esc(x.position||'Contact')}</div><div><h3>${esc(x.name||x.office||'')}</h3><p>${esc(x.description||'')}</p></div><div class="calendar-meta">${x.email?`<a class="text-link" href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:''}${x.office?`<span>${esc(x.office)}</span>`:''}</div></article>`).join('')||'<div class="empty">No contacts have been published yet.</div>';document.getElementById('officers').innerHTML=draw('officer');document.getElementById('offices').innerHTML=draw('university')}load();
</script></body></html>
